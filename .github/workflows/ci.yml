# This project, named `Frontend_Demo`, is a client-side web application.
# It serves as a demonstration or showcase of frontend capabilities, involving
# interactive UI components, specific framework features, and integrating with
# external APIs to present dynamic content and user authentication workflows.
# Built using React, Vite, and Tailwind CSS, it's a Single Page Application (SPA).
#
# Sprint work completed this cycle:
# FAD-2, FAD-5, FAD-9, FAD-14, FAD-7, FAD-13, FAD-11, FAD-16, FAD-12, FAD-15, FAD-17, FAD-10, FAD-18, FAD-8

name: CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Using a recent LTS version for React/Vite

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run linting
        run: npm run lint --if-present
        continue-on-error: true # Continue even if linting issues are found

      - name: Run tests
        run: npm test --if-present
        continue-on-error: true # Continue even if tests fail

      - name: Build project
        run: npm run build --if-present

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.ref == 'refs/heads/main' # Only deploy on pushes to the main branch

    env:
      # EC2_HOST is used to check if deployment secrets are configured
      EC2_HOST: ${{ secrets.EC2_HOST }}

    steps:
      - name: Check for EC2 deploy secrets
        if: env.EC2_HOST == ''
        run: |
          echo "⚠️ EC2_HOST secret is not configured. Skipping deployment."
          exit 0 # Exit cleanly without failure

      - name: Checkout repository
        if: env.EC2_HOST != ''
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        if: env.EC2_HOST != ''
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Source nvm so node/npm/pnpm are available in the non-interactive SSH shell
            export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            # cd to the deploy path
            cd ${{ secrets.EC2_DEPLOY_PATH }}

            # Fetch and hard-reset to remote so local changes never block the deploy
            git fetch origin main
            git reset --hard origin/main

            # Sync new env vars from .env.sample into .env (append missing keys only, never overwrite)
            if [ -f .env.sample ]; then
              touch .env
              while IFS= read -r line; do
                # skip blank lines and comments
                [[ -z "$line" || "$line" == \#* ]] && continue
                key=$(echo "$line" | cut -d= -f1)
                # only append if key not already present in .env
                if ! grep -q "^${key}=" .env 2>/dev/null; then
                  echo "$line" >> .env
                  echo "⚠️  New env var added (set real value): ${key}"
                fi
              done < .env.sample
            fi

            # Install dependencies WITHOUT assuming a lockfile exists
            if [ -f package-lock.json ]; then npm ci; else npm install; fi

            # Run build step if the project has one, tolerating its absence
            npm run build --if-present

            # Restart the app with PM2 using zero-downtime reload
            # Assumes 'npm start' command serves the application (e.g., 'vite preview' or 'serve -s dist')
            pm2 reload app --update-env || pm2 start npm --name app -- start

            # Save PM2 process list to be persistent across reboots
            pm2 save
